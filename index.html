<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Static Block — Raycast Engine</title>
<style>
  html, body {
    margin:0; padding:0; height:100%; background:#03060a; overflow:hidden;
    overscroll-behavior:none; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  canvas { display:block; width:100vw; height:100vh; height:100dvh; touch-action:none; }
  .hud {
    position:fixed; pointer-events:none; user-select:none;
    font:11px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace;
    color:#2d7f8a; letter-spacing:0.5px; text-shadow:0 0 6px rgba(0,180,200,.25);
  }
  #stats { top:10px; left:12px; }
  /* the help line can sit over lit walls now, so it needs the outline too */
  #help  { bottom:10px; left:12px; right:12px; color:#579aa6;
           text-shadow:0 0 3px #000, 0 0 8px #000; }
  /* centred, capped width, and sitting above the joystick */
  #prompt, #msg { left:0; right:0; margin:0 auto; max-width:min(30em, 86vw);
                  text-align:center; font-size:13px; }
  /* both sit over lit walls, so they carry their own dark outline */
  #prompt { bottom:30%; color:#ffd9a0; text-shadow:0 0 3px #000, 0 0 8px #000, 0 1px 2px #000; }
  #msg {
    bottom:23%; color:#cdf4fb; padding:0 18px;
    text-shadow:0 0 3px #000, 0 0 8px #000, 0 1px 2px #000;
    opacity:0; transition:opacity .5s ease;
  }
  #help.touch { bottom:auto; right:12px; }   /* top set in layout(), under the minimap */
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div class="hud" id="stats"></div>
<div class="hud" id="help"></div>
<div class="hud" id="prompt"></div>
<div class="hud" id="msg"></div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 *  STATIC BLOCK — step 1: DDA raycaster, character-cell renderer.
 *  One ray per character column. Walls drawn as vertical stripes whose
 *  glyph density + brightness fall off with distance.
 * ------------------------------------------------------------------ */

/* ---------- 1. WORLD MAP ------------------------------------------ *
 *  Section 6 scope: one and a bit city blocks, exteriors only.
 *  The shop and Mrs Ilic's face each other across a street, with the
 *  alley and its dumpster cut in between them, and a cross street
 *  running south past the rival's stall. Buildings are solid — no
 *  interiors yet, the doors are markers.
 *
 *  Edit the art directly; each row must stay the same length.
 *    .  street / alley / walkable      #  plain block wall
 *    S  THE FIX (your shop)            s  your shop door
 *    I  Mrs Ilic's building            i  her door
 *    V  rival's stall (low)            D  dumpster (low)
 *    B  city backdrop (tall, distant, seals the playable area)
 * ------------------------------------------------------------------ */
const MAP_ART = [
  "BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB",
  "B#####SSSSSSSSS...IIIIIIIIII##....#########B",
  "B#####SSSSSSSSS.D.IIIIIIIIII##....#########B",
  "B#####SSSSSSSSS...IIIIIIIIII##....#########B",
  "B#####SSSSSSSSS...IIIIIIIIII##....#########B",
  "B#####SSSSSSSSS...IIIIIIIIII##....#########B",
  "B#####SSSSSSSSS...IIIIIIIIII##....#########B",
  "B#####SSSSSSSSS...IIIIIIIIII##....#########B",
  "B#####SSSSssSSS...IIIIiiIIII##....#########B",
  "B..........................................B",
  "B..........................................B",
  "B..........................................B",
  "B.....................VVVV.................B",
  "B.....................VVVV.................B",
  "B#############################....#########B",
  "B#############################....#########B",
  "B#############################....#########B",
  "B#############################....#########B",
  "B#############################....#########B",
  "B#############################....#########B",
  "B#############################....#########B",
  "BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB"
];

/* Materials. h is wall height in map units with the eye at 0.5, so
   anything under ~0.9 can be seen over. ramp is that surface's glyph
   ramp, sparse to dense; bank picks its colour block in PALETTE. */
const MAT = {
  1: { name: "WALL",      h: 2.6, bank: 0, ramp: "··..::░░▒▒▓█" },
  2: { name: "THE FIX",   h: 1.9, bank: 1, ramp: "··--==##%%@█" },
  3: { name: "ILIC BLDG", h: 2.2, bank: 2, ramp: "··''::!!||║█" },
  4: { name: "STALL",     h: 0.85, bank: 3, ramp: "··,,xxXX##▒█" },
  5: { name: "SKYLINE",   h: 5.0, bank: 4, ramp: "····..::::░▒" },
  6: { name: "DUMPSTER",  h: 0.62, bank: 5, ramp: "··..::░░▒▒▓█",
       prop: { text: "Rain and flattened cardboard. Something metal underneath." } },
  7: { name: "SHOP DOOR", h: 1.9, bank: 5, ramp: "··..::░░▒▒▓█",
       prop: { text: "THE FIX — your shop. Shut for now; the inside comes later." } },
  8: { name: "ILIC DOOR", h: 2.2, bank: 5, ramp: "··..::░░▒▒▓█",
       prop: { text: "Mr Ilic's door. A lamp with a frayed cord sits just inside." } }
};
const LEGEND = { ".": 0, "#": 1, "S": 2, "I": 3, "V": 4, "B": 5, "D": 6, "s": 7, "i": 8 };
const REACH = 2.6;          // how close you must be to interact, in map cells

const MAP = MAP_ART.map(function (row, y) {
  return row.split("").map(function (ch, x) {
    if (!(ch in LEGEND)) throw new Error("unknown map glyph '" + ch + "' at " + x + "," + y);
    return LEGEND[ch];
  });
});
const MAP_H = MAP.length;
const MAP_W = MAP[0].length;
MAP.forEach(function (row, y) {
  if (row.length !== MAP_W) throw new Error("map row " + y + " is " + row.length + ", expected " + MAP_W);
});

function cellAt(cx, cy) {
  if (cx < 0 || cy < 0 || cx >= MAP_W || cy >= MAP_H) return 5;
  return MAP[cy][cx];
}
function isWall(cx, cy) { return cellAt(cx, cy) !== 0; }   // every prop is solid
function matOf(v) { return MAT[v] || MAT[1]; }

/* ---------- 2. PLAYER --------------------------------------------- */
const player = { x: 10.5, y: 12.1, a: -35 * Math.PI / 180 };  // on the street outside your shop

const FOV        = 66 * Math.PI / 180;
const TAN_HALF   = Math.tan(FOV / 2);
const MOVE_SPEED = 3.0;    // cells / second
const STRAFE_MUL = 0.85;
const RUN_MUL    = 1.9;
const TURN_SPEED = 2.4;    // radians / second
const RADIUS     = 0.22;   // player collision radius
const JOY_DEAD   = 0.16;   // joystick dead zone, fraction of its radius
const LOOK_SENS  = 0.0055; // radians turned per pixel of look-drag
const VIEW_DIST  = 32;     // distance at which everything is fully dim
const GRID_STEP  = 2;      // floor grid line spacing, in map cells
const GRID_DIST  = 11;     // ground grid draw distance

/* ---------- 3. SCREEN / CHARACTER GRID ---------------------------- */
const FONT_STACK = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace';
const BG = "#03060a";

const cv  = document.getElementById("screen");
const ctx = cv.getContext("2d", { alpha: false });

let W = 0, H = 0, fontPx = 14, cellW = 8, cellH = 15;
let canvasLeft = 0, canvasTop = 0;
let mapScale = 4, mapPanelH = 0;   // minimap geometry, so the HUD can dodge it
let COLS = 0, ROWS = 0, offX = 0, offY = 0;

let fbChar, fbShade;                       // character framebuffer
let colTop, colBottom;                     // nearest surface per column
let slabCount, slabDist, slabTop, slabBottom, slabCell, slabSide, slabType;
let slabRayX, slabRayY;                    // ray direction per column, for tap hits
let prevCX, prevCY;                        // floor-grid sampling scratch

/* Shade levels run sparse/dim -> dense/bright. Each material has its
   own glyph ramp (see MAT) and its own colour bank below, so the shop,
   Mrs Ilic's and the plain block walls read as different surfaces even
   though they share one density scale. */
const LEVELS = 12;
const BANK = 16;                            // palette slots reserved per bank
const RAMP = MAT[1].ramp;                   // fallback ramp

/* hue, saturation, min lum, max lum — one entry per bank */
const BANKS = [
  [197, 88, 10, 66],   // 0 plain block wall — steel cyan
  [148, 78, 10, 60],   // 1 THE FIX          — green
  [280, 62, 11, 64],   // 2 Mrs Ilic's       — violet
  [ 52, 88, 12, 62],   // 3 rival's stall    — yellow
  [218, 55,  6, 30],   // 4 skyline          — stays dim, reads as distance
  [ 38, 95, 11, 58]    // 5 interactive      — amber
];
const PALETTE = [];
BANKS.forEach(function (bnk) {
  const base = PALETTE.length;
  for (let i = 0; i < LEVELS; i++) {
    const t = i / (LEVELS - 1);
    const lum = bnk[2] + (bnk[3] - bnk[2]) * Math.pow(t, 0.9);
    PALETTE.push("hsl(" + bnk[0] + "," + bnk[1] + "%," + lum.toFixed(0) + "%)");
  }
  while (PALETTE.length < base + BANK) PALETTE.push(PALETTE[base]);
});
const ALT = 5 * BANK;                       // interactive bank, used by the HUD

function layout() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  // measure the element, not the window: with 100dvh they differ on mobile
  const rect = cv.getBoundingClientRect();
  canvasLeft = rect.left;
  canvasTop  = rect.top;
  W = Math.max(1, Math.round(rect.width  || window.innerWidth));
  H = Math.max(1, Math.round(rect.height || window.innerHeight));
  cv.width  = Math.max(1, Math.round(W * dpr));
  cv.height = Math.max(1, Math.round(H * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  fontPx = Math.max(8, Math.round(Math.min(W, H) / 46));
  ctx.font = fontPx + "px " + FONT_STACK;
  cellW = ctx.measureText("M").width || fontPx * 0.6;
  cellH = Math.max(2, Math.round(fontPx * 1.08));

  COLS = Math.max(8, Math.floor(W / cellW));
  ROWS = Math.max(8, Math.floor(H / cellH));
  offX = (W - COLS * cellW) / 2;
  offY = (H - ROWS * cellH) / 2;

  fbChar  = new Array(COLS * ROWS).fill(" ");
  fbShade = new Uint8Array(COLS * ROWS);

  colTop    = new Int32Array(COLS);
  colBottom = new Int32Array(COLS);

  const cells = COLS * MAX_SLABS;
  slabCount  = new Uint8Array(COLS);
  slabDist   = new Float32Array(cells);
  slabTop    = new Int32Array(cells);
  slabBottom = new Int32Array(cells);
  slabCell   = new Int32Array(cells);
  slabSide   = new Uint8Array(cells);
  slabType   = new Uint8Array(cells);
  slabRayX   = new Float32Array(COLS);
  slabRayY   = new Float32Array(COLS);

  prevCX = new Int32Array(COLS);
  prevCY = new Int32Array(COLS);

  mapScale  = Math.max(3, Math.round(Math.min(W, H) / 170));
  mapPanelH = MAP_H * mapScale + 6;

  joy.radius = Math.round(Math.max(46, Math.min(W, H) * 0.14));
  joy.homeX  = joy.radius + Math.round(Math.min(W, H) * 0.06);
  joy.homeY  = H - joy.radius - Math.max(30, Math.round(Math.min(W, H) * 0.06));
  if (typeof setHelp === "function") setHelp();   // help offset depends on the minimap
  if (!joy.active) { joy.curX = joy.homeX; joy.curY = joy.homeY; }
}
window.addEventListener("resize", layout);
window.addEventListener("orientationchange", function () { setTimeout(layout, 120); });
if (window.visualViewport) window.visualViewport.addEventListener("resize", layout);

function put(col, row, ch, shade) {
  if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return;
  const i = row * COLS + col;
  fbChar[i]  = ch;
  fbShade[i] = shade;
}

/* ---------- 4. INPUT ---------------------------------------------- */
/* Touch is the control scheme. The keyboard is kept only as a desktop
   testing convenience — set DEV_KEYS to false for touch-only. */
const DEV_KEYS = true;

const keys = Object.create(null);
let showFill = true, showMap = true;

if (DEV_KEYS) {
  window.addEventListener("keydown", function (e) {
    keys[e.code] = true;
    if (e.code === "Space" || e.code === "KeyF") {
      if (!e.repeat) { const t = targetAt(COLS >> 1, null); if (t) interact(t); }
    }
    if (e.code === "KeyT") showFill = !showFill;
    if (e.code === "KeyM") showMap  = !showMap;
    if (e.code.indexOf("Arrow") === 0 || e.code === "Space") e.preventDefault();
  });
  window.addEventListener("keyup", function (e) { keys[e.code] = false; });
  window.addEventListener("blur", function () { for (const k in keys) keys[k] = false; });
}

// losing focus mid-drag must not leave the stick stuck on
window.addEventListener("blur", function () {
  joy.pointerId = null;
  joy.active = false;
  joy.curX = joy.homeX; joy.curY = joy.homeY;
  lookId = null;
  lookDelta = 0;
});

function down() {
  for (let i = 0; i < arguments.length; i++) if (keys[arguments[i]]) return true;
  return false;
}

/* ---------- 4b. TOUCH: VIRTUAL JOYSTICK + LOOK-DRAG ---------------- *
 *  Fixed joystick, bottom-left: press on or near it and the knob
 *  follows your thumb. Push up/down to walk, left/right to turn.
 *  Anywhere else: drag to look around, or tap to fire a world-space
 *  interaction event. Pointer events, so a desktop mouse drives the
 *  same code path a thumb does.
 * ------------------------------------------------------------------ */
const joy = {
  pointerId: null, active: false,
  curX: 0, curY: 0,          // knob position, absolute screen pixels
  homeX: 0, homeY: 0,        // fixed base — never moves
  radius: 60
};
const JOY_GRAB = 1.45;       // press within this multiple of the radius to grab
let lookId = null, lookLastX = 0, lookDelta = 0;
const coarsePointer = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
let touchUsed = false;

function pointerPos(e) {
  return { x: e.clientX - canvasLeft, y: e.clientY - canvasTop };
}
function onStick(p) {
  return Math.hypot(p.x - joy.homeX, p.y - joy.homeY) <= joy.radius * JOY_GRAB;
}

/* A press counts as a tap if it is brief and barely moves. The pointer
   driving the stick never taps, so working the joystick cannot fire an
   interaction; every other pointer can. */
const TAP_MS = 280, TAP_SLOP = 12;
const taps = new Map();

cv.addEventListener("pointerdown", function (e) {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  const p = pointerPos(e);
  if (e.pointerType !== "mouse") { touchUsed = true; setHelp(); }

  const grab = joy.pointerId === null && onStick(p);
  taps.set(e.pointerId, { x: p.x, y: p.y, t: performance.now(), blocked: grab });

  if (grab) {
    joy.pointerId = e.pointerId;
    joy.active = true;
    joy.curX = p.x; joy.curY = p.y;
  } else if (lookId === null) {
    lookId = e.pointerId;
    lookLastX = p.x;
  }
  if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
  e.preventDefault();
});

cv.addEventListener("pointermove", function (e) {
  const p = pointerPos(e);
  const tap = taps.get(e.pointerId);
  if (tap && Math.hypot(p.x - tap.x, p.y - tap.y) > TAP_SLOP) tap.blocked = true;

  if (e.pointerId === joy.pointerId) {
    joy.curX = p.x; joy.curY = p.y;
    e.preventDefault();
  } else if (e.pointerId === lookId) {
    lookDelta += (p.x - lookLastX) * LOOK_SENS;
    lookLastX = p.x;
    e.preventDefault();
  }
});

function releasePointer(e) {
  if (e.pointerId === joy.pointerId) {
    joy.pointerId = null;
    joy.active = false;
    joy.curX = joy.homeX; joy.curY = joy.homeY;   // knob recentres
  } else if (e.pointerId === lookId) {
    lookId = null;
  }
}
cv.addEventListener("pointerup", function (e) {
  const tap = taps.get(e.pointerId);
  taps.delete(e.pointerId);
  if (tap && !tap.blocked && performance.now() - tap.t < TAP_MS) {
    const p = pointerPos(e);
    fireWorldTap(p.x, p.y);
  }
  releasePointer(e);
});
cv.addEventListener("pointercancel", function (e) { taps.delete(e.pointerId); releasePointer(e); });
cv.addEventListener("lostpointercapture", releasePointer);
cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });

/* Joystick deflection as x/y in -1..1, dead zone removed and the
   remainder rescaled so it still reaches full tilt at the rim. */
function joyVector() {
  if (!joy.active) return { x: 0, y: 0 };
  let dx = (joy.curX - joy.homeX) / joy.radius;
  let dy = (joy.curY - joy.homeY) / joy.radius;
  let mag = Math.hypot(dx, dy);
  if (mag < 1e-6) return { x: 0, y: 0 };
  if (mag > 1) { dx /= mag; dy /= mag; mag = 1; }
  if (mag <= JOY_DEAD) return { x: 0, y: 0 };
  const scaled = Math.pow((mag - JOY_DEAD) / (1 - JOY_DEAD), 1.3) / mag;
  return { x: dx * scaled, y: dy * scaled };
}

/* ---------- 5. MOVEMENT + COLLISION ------------------------------- */
function free(nx, ny) {
  const r = RADIUS;
  return !isWall(Math.floor(nx - r), Math.floor(ny - r)) &&
         !isWall(Math.floor(nx + r), Math.floor(ny - r)) &&
         !isWall(Math.floor(nx - r), Math.floor(ny + r)) &&
         !isWall(Math.floor(nx + r), Math.floor(ny + r));
}

function update(dt) {
  let turn = 0, fwd = 0, strafe = 0;
  if (down("KeyA", "ArrowLeft"))  turn -= 1;
  if (down("KeyD", "ArrowRight")) turn += 1;
  if (down("KeyW", "ArrowUp"))    fwd  += 1;
  if (down("KeyS", "ArrowDown"))  fwd  -= 1;
  if (down("KeyQ")) strafe -= 1;
  if (down("KeyE")) strafe += 1;

  const j = joyVector();
  fwd  -= j.y;              // screen-up on the stick is forward
  turn += j.x;
  if (fwd  >  1) fwd  =  1; else if (fwd  < -1) fwd  = -1;
  if (turn >  1) turn =  1; else if (turn < -1) turn = -1;

  const run = down("ShiftLeft", "ShiftRight") ? RUN_MUL : 1;
  player.a += turn * TURN_SPEED * dt + lookDelta;
  lookDelta = 0;            // look-drag is positional, not rate-based
  if (player.a > Math.PI)  player.a -= Math.PI * 2;
  if (player.a < -Math.PI) player.a += Math.PI * 2;

  const dx = Math.cos(player.a), dy = Math.sin(player.a);
  // strafe axis = facing rotated 90 degrees clockwise on screen
  let mx = (dx * fwd + -dy * strafe * STRAFE_MUL) * MOVE_SPEED * run * dt;
  let my = (dy * fwd +  dx * strafe * STRAFE_MUL) * MOVE_SPEED * run * dt;

  // resolve one axis at a time so the player slides along walls
  if (free(player.x + mx, player.y)) player.x += mx;
  if (free(player.x, player.y + my)) player.y += my;
}

/* ---------- 5b. INTERACTION ---------------------------------------- *
 *  Every column already knows every surface it crossed and how far away
 *  each one is, so a tap is a lookup into this frame's cast results —
 *  no extra ray. Scanning near to far means tapping a dumpster hits the
 *  dumpster, and tapping above it hits the building behind.
 * ------------------------------------------------------------------- */
let focusCell = -1, focusType = 0;      // what the centre of the view is on
let flashType = 0, flashUntil = 0, msgUntil = 0, nowMs = 0;

/* The nearest slab in this column whose span contains that row.
   row === null means "whatever is at eye level", which is what the
   centre-of-screen focus check wants. */
function slabAt(col, row) {
  if (!slabCount || col < 0 || col >= COLS) return -1;
  const base = col * MAX_SLABS;
  const at = row === null ? ROWS >> 1 : row;
  for (let k = 0; k < slabCount[col]; k++) {
    const i = base + k;
    const tol = matOf(slabType[i]).prop ? 2 : 0;   // props get a forgiving edge
    if (at >= slabTop[i] - tol && at <= slabBottom[i] + tol) return i;
  }
  return -1;
}

function targetAt(col, row) {
  const i = slabAt(col, row);
  if (i < 0) return null;
  if (!matOf(slabType[i]).prop) return null;
  if (slabDist[i] > REACH) return null;
  return { type: slabType[i], cell: slabCell[i] };
}

function updateFocus() {
  const t = targetAt(COLS >> 1, null);
  focusCell = t ? t.cell : -1;
  focusType = t ? t.type : 0;
  const label = t ? "▸ " + matOf(t.type).name : "";
  if (promptEl.textContent !== label) promptEl.textContent = label;
}

function interact(t) {
  const mat = matOf(t.type);
  if (!mat.prop) return;
  flashType  = t.type;                   // tapping off-centre still highlights it
  flashUntil = nowMs + 260;
  msgUntil   = nowMs + 3200;
  msgEl.textContent = mat.prop.text;
  msgEl.style.opacity = "1";
}

/* Turn a tap in screen pixels into a world-space event.
   Because posX + rayDir * perpWallDist lands exactly on the surface,
   the same multiply gives the world point for ground taps using their
   own row distance. Returns null only if the tap misses the grid. */
function worldTapEvent(px, py) {
  const col = Math.floor((px - offX) / cellW);
  const row = Math.floor((py - offY) / cellH);
  if (!slabCount || col < 0 || col >= COLS) return null;

  const rx = slabRayX[col], ry = slabRayY[col];
  const ev = {
    kind: "", material: null, height: 0, distance: 0, inReach: false, prop: false,
    world: null, cell: null,
    screen: { x: Math.round(px), y: Math.round(py), col: col, row: row },
    ray: { x: rx, y: ry },
    from: { x: +player.x.toFixed(3), y: +player.y.toFixed(3), angle: +player.a.toFixed(3) }
  };

  const i = slabAt(col, row);
  let dist;

  if (i >= 0) {
    const mat = matOf(slabType[i]);
    dist = slabDist[i];
    ev.kind = mat.prop ? "prop" : "wall";
    ev.material = mat.name;
    ev.height = mat.h;
    ev.prop = !!mat.prop;
    ev.side = slabSide[i];
  } else {
    const p = row - ROWS / 2;             // above or below the horizon
    if (p <= 0) { ev.kind = "sky"; return ev; }
    dist = (0.5 * ROWS) / p;
    ev.kind = "ground";
  }

  const wx = player.x + rx * dist, wy = player.y + ry * dist;
  ev.distance = +dist.toFixed(3);
  ev.inReach  = dist <= REACH;
  ev.world    = { x: +wx.toFixed(3), y: +wy.toFixed(3) };
  ev.cell     = { x: Math.floor(wx), y: Math.floor(wy), value: cellAt(Math.floor(wx), Math.floor(wy)) };
  if (i >= 0) ev.cell = { x: slabCell[i] % MAP_W, y: Math.floor(slabCell[i] / MAP_W), value: slabType[i] };
  return ev;
}

/* ---- THE HOOK -----------------------------------------------------
   Every tap and click on the view arrives here. Reassign
   window.onWorldTap to plug in dialogue, job pickup, scavenging, etc.
   The default logs the event and runs the placeholder prop response. */
window.onWorldTap = function (ev) {
  console.log("[world tap]", ev.kind, ev.material || "",
    ev.cell ? "cell " + ev.cell.x + "," + ev.cell.y : "",
    ev.world ? "@ " + ev.world.x + "," + ev.world.y : "",
    ev.inReach ? "(in reach)" : "(out of reach)", ev);

  if (ev.prop && ev.inReach) {
    interact({ type: ev.cell.value, cell: ev.cell.y * MAP_W + ev.cell.x });
  }
};

function fireWorldTap(px, py) {
  const ev = worldTapEvent(px, py);
  if (ev && typeof window.onWorldTap === "function") window.onWorldTap(ev);
  return ev;
}

/* ---------- 6. RAYCAST (DDA) -------------------------------------- *
 *  A ray no longer stops at the first wall. Because buildings differ in
 *  height, a low dumpster leaves the block behind it visible above, so
 *  each column keeps every surface it crossed and the drawing pass
 *  paints them far to near. Casting stops once a slab reaches the top
 *  of the screen — nothing behind that can show.
 * ------------------------------------------------------------------ */
const MAX_SLABS = 6;

function castColumns(dirX, dirY, planeX, planeY) {
  const horizon = ROWS / 2;

  for (let col = 0; col < COLS; col++) {
    const cameraX = 2 * col / COLS - 1;          // -1 .. +1 across the screen
    const rayX = dirX + planeX * cameraX;
    const rayY = dirY + planeY * cameraX;

    let mapX = Math.floor(player.x);
    let mapY = Math.floor(player.y);

    const deltaX = rayX === 0 ? Infinity : Math.abs(1 / rayX);
    const deltaY = rayY === 0 ? Infinity : Math.abs(1 / rayY);

    let stepX, stepY, sideDistX, sideDistY;
    if (rayX < 0) { stepX = -1; sideDistX = (player.x - mapX) * deltaX; }
    else          { stepX =  1; sideDistX = (mapX + 1 - player.x) * deltaX; }
    if (rayY < 0) { stepY = -1; sideDistY = (player.y - mapY) * deltaY; }
    else          { stepY =  1; sideDistY = (mapY + 1 - player.y) * deltaY; }

    let side = 0, n = 0, minTop = ROWS + 1;
    const base = col * MAX_SLABS;

    for (let guard = 0; guard < 160; guard++) {
      if (Math.min(sideDistX, sideDistY) > VIEW_DIST) break;   // past the fog
      if (sideDistX < sideDistY) { sideDistX += deltaX; mapX += stepX; side = 0; }
      else                       { sideDistY += deltaY; mapY += stepY; side = 1; }

      const cell = cellAt(mapX, mapY);
      if (cell === 0) continue;

      // perpendicular distance -> no fisheye distortion
      let dist = side === 0
        ? (mapX - player.x + (1 - stepX) / 2) / rayX
        : (mapY - player.y + (1 - stepY) / 2) / rayY;
      if (!(dist > 0.0001)) dist = 0.0001;

      // eye sits at 0.5, so a wall of height h spans these rows
      const proj = ROWS / dist;
      const top    = Math.round(horizon - (matOf(cell).h - 0.5) * proj);
      const bottom = Math.round(horizon + 0.5 * proj);

      // every surface shares the ground line, so a farther one is only
      // visible where it pokes above everything nearer — skip it otherwise
      if (top >= minTop) { if (minTop <= 0) break; continue; }
      minTop = top;

      const i = base + n;
      slabDist[i]   = dist;
      slabTop[i]    = top;
      slabBottom[i] = bottom;
      slabCell[i]   = mapY * MAP_W + mapX;
      slabSide[i]   = side;
      slabType[i]   = cell;
      n++;

      if (top <= 0 || n >= MAX_SLABS) break;   // this slab hides everything behind
    }

    slabCount[col] = n;
    slabRayX[col]  = rayX;
    slabRayY[col]  = rayY;
    // nearest surface, used by the ground grid and by taps
    colTop[col]    = n ? slabTop[base] : ROWS + 1;
    colBottom[col] = n ? slabBottom[base] : -1;
  }
}

function shadeFor(dist, side) {
  const t = 1 - Math.min(dist / VIEW_DIST, 1);
  let lvl = Math.round((LEVELS - 1) * Math.pow(t, 0.85));
  if (side === 1) lvl -= 2;                 // N/S faces read darker
  return Math.max(0, Math.min(LEVELS - 1, lvl));
}

/* ---------- 7. DRAW WALLS ----------------------------------------- */
function drawWalls() {
  for (let col = 0; col < COLS; col++) {
    const n = slabCount[col];
    const base = col * MAX_SLABS;
    const pn = col > 0 ? slabCount[col - 1] : 0;
    const pbase = (col - 1) * MAX_SLABS;

    for (let k = n - 1; k >= 0; k--) {          // painter's order: far to near
      const i = base + k;
      const type = slabType[i];
      const mat  = matOf(type);
      const bank = mat.bank * BANK;
      let lvl = shadeFor(slabDist[i], slabSide[i]);

      // a focused (or just-tapped) prop lifts out of the background —
      // by type, so every cell of a multi-cell prop lights together
      if (mat.prop && slabDist[i] <= REACH) {
        if (type === flashType && flashUntil > nowMs) lvl = Math.min(LEVELS - 1, lvl + 4);
        else if (type === focusType)                  lvl = Math.min(LEVELS - 1, lvl + 2);
      }

      const top = slabTop[i], bottom = slabBottom[i];
      const y0 = Math.max(0, top), y1 = Math.min(ROWS - 1, bottom);
      const shade  = bank + lvl;
      const bright = bank + Math.min(LEVELS - 1, lvl + 3);
      const glyph  = mat.ramp.charAt(lvl);

      if (showFill) {
        for (let row = y0; row <= y1; row++) put(col, row, glyph, shade);
      }

      // wireframe: vertical edge wherever this slab lands on a different
      // wall cell / face than the matching slab of the previous column
      const edge = col === 0 || k >= pn ||
                   slabCell[i] !== slabCell[pbase + k] ||
                   slabSide[i] !== slabSide[pbase + k];

      if (edge) {
        for (let row = y0; row <= y1; row++) put(col, row, "│", bright);
      }
      if (top >= 0 && top < ROWS)       put(col, top,    edge ? "┼" : "─", bright);
      if (bottom >= 0 && bottom < ROWS) put(col, bottom, edge ? "┼" : "─", bright);
    }
  }
}

/* ---------- 8. GROUND GRID ---------------------------------------- */
/* Perspective-correct ground grid. A cell is marked when the sampled
   floor point crosses an integer boundary from its neighbour (left, or
   the row above) — that catches grid lines that fall between two sample
   points instead of dropping them. The sky above stays empty. */
function drawGrid(dirX, dirY, planeX, planeY) {
  const leftX = dirX - planeX, leftY = dirY - planeY;
  const rightX = dirX + planeX, rightY = dirY + planeY;
  const horizon = ROWS / 2;
  let prevRowValid = false;

  for (let row = Math.floor(horizon) + 1; row < ROWS; row++) {
    const rowDist = (0.5 * ROWS) / (row - horizon);
    if (rowDist > GRID_DIST) { prevRowValid = false; continue; }

    const stepX = rowDist * (rightX - leftX) / COLS;
    const stepY = rowDist * (rightY - leftY) / COLS;
    let fx = player.x + rowDist * leftX;
    let fy = player.y + rowDist * leftY;

    const t = 1 - rowDist / GRID_DIST;
    const shade = Math.max(0, Math.round(3 * t));   // deliberately faint

    let leftCX = Math.floor(fx / GRID_STEP), leftCY = Math.floor(fy / GRID_STEP);

    for (let col = 0; col < COLS; col++) {
      const cx = Math.floor(fx / GRID_STEP), cy = Math.floor(fy / GRID_STEP);
      const crossX = (col > 0 && cx !== leftCX) || (prevRowValid && cx !== prevCX[col]);
      const crossY = (col > 0 && cy !== leftCY) || (prevRowValid && cy !== prevCY[col]);

      if (crossX || crossY) {
        const ch = (crossX && crossY) ? "+" : (crossX ? "│" : "─");
        if (row > colBottom[col]) put(col, row, ch, shade);
      }

      prevCX[col] = cx; prevCY[col] = cy;
      leftCX = cx;      leftCY = cy;
      fx += stepX;      fy += stepY;
    }
    prevRowValid = true;
  }
}

/* ---------- 9. FRAMEBUFFER -> CANVAS ------------------------------ */
function blit() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  ctx.font = fontPx + "px " + FONT_STACK;
  ctx.textBaseline = "top";

  for (let row = 0; row < ROWS; row++) {
    const base = row * COLS;
    const y = offY + row * cellH;
    let runStart = 0, runShade = -1, buf = "";

    for (let col = 0; col <= COLS; col++) {
      const ch = col < COLS ? fbChar[base + col] : " ";
      const sh = col < COLS ? fbShade[base + col] : -1;

      if (ch === " " || sh !== runShade) {
        if (buf) {                                   // flush the current run
          ctx.fillStyle = PALETTE[runShade];
          ctx.fillText(buf, offX + runStart * cellW, y);
          buf = "";
        }
        if (ch !== " ") { runStart = col; runShade = sh; buf = ch; }
        else runShade = -1;
      } else {
        buf += ch;
      }
    }
  }
}

/* ---------- 10. JOYSTICK OVERLAY ---------------------------------- */
function drawJoystick() {
  const r = joy.radius;
  const bx = joy.homeX, by = joy.homeY;

  let kx = joy.curX - bx, ky = joy.curY - by;
  const mag = Math.hypot(kx, ky);
  if (mag > r) { kx = kx / mag * r; ky = ky / mag * r; }

  ctx.save();
  ctx.lineWidth = Math.max(1, r * 0.022);

  // outer ring
  ctx.strokeStyle = joy.active ? "rgba(90,225,240,0.40)" : "rgba(90,225,240,0.16)";
  ctx.beginPath();
  ctx.arc(bx, by, r, 0, Math.PI * 2);
  ctx.stroke();

  // dead-zone ring
  ctx.strokeStyle = joy.active ? "rgba(90,225,240,0.20)" : "rgba(90,225,240,0.09)";
  ctx.beginPath();
  ctx.arc(bx, by, r * JOY_DEAD, 0, Math.PI * 2);
  ctx.stroke();

  // axis ticks, so the walk/turn axes are readable at a glance
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    ctx.moveTo(bx + Math.cos(a) * r * 0.86, by + Math.sin(a) * r * 0.86);
    ctx.lineTo(bx + Math.cos(a) * r * 0.98, by + Math.sin(a) * r * 0.98);
  }
  ctx.stroke();

  // knob
  ctx.fillStyle   = joy.active ? "rgba(120,255,230,0.20)" : "rgba(120,255,230,0.07)";
  ctx.strokeStyle = joy.active ? "rgba(150,255,235,0.85)" : "rgba(150,255,235,0.28)";
  ctx.beginPath();
  ctx.arc(bx + kx, by + ky, r * 0.34, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

/* ---------- 11. MINIMAP ------------------------------------------- */
function drawMinimap() {
  const s = mapScale;
  const px = W - 14 - MAP_W * s, py = 14;

  ctx.globalAlpha = 0.85;
  ctx.fillStyle = "rgba(3,10,16,0.75)";
  ctx.fillRect(px - 3, py - 3, MAP_W * s + 6, MAP_H * s + 6);
  ctx.strokeStyle = "rgba(60,180,200,0.25)";
  ctx.strokeRect(px - 3.5, py - 3.5, MAP_W * s + 7, MAP_H * s + 7);

  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const c = MAP[y][x];
      if (!c) continue;
      const bnk = BANKS[matOf(c).bank];
      ctx.fillStyle = "hsla(" + bnk[0] + "," + bnk[1] + "%,55%," + (matOf(c).prop ? 0.9 : 0.5) + ")";
      ctx.fillRect(px + x * s, py + y * s, s - 1, s - 1);
    }
  }

  const cx = px + player.x * s, cy = py + player.y * s;
  ctx.strokeStyle = "rgba(120,255,230,0.5)";
  ctx.beginPath();
  for (const sgn of [-1, 1]) {
    ctx.moveTo(cx, cy);
    const a = player.a + sgn * FOV / 2;
    ctx.lineTo(cx + Math.cos(a) * s * 5, cy + Math.sin(a) * s * 5);
  }
  ctx.stroke();

  ctx.fillStyle = "#8ffbe4";
  ctx.beginPath();
  ctx.arc(cx, cy, Math.max(1.5, s * 0.28), 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* ---------- 12. GAME LOOP ----------------------------------------- */
const statsEl  = document.getElementById("stats");
const helpEl   = document.getElementById("help");
const promptEl = document.getElementById("prompt");
const msgEl    = document.getElementById("msg");

function setHelp() {
  const mobile = touchUsed || coarsePointer;
  helpEl.classList.toggle("touch", mobile);
  helpEl.style.top = mobile ? (14 + mapPanelH + 10) + "px" : "";
  helpEl.innerHTML = mobile
    ? "joystick: move &nbsp;·&nbsp; drag: look &nbsp;·&nbsp; tap: interact"
    : "drag the stick: move &nbsp;·&nbsp; drag elsewhere: look &nbsp;·&nbsp; click: interact" +
      (DEV_KEYS ? "<br>dev keys: WASD / arrows &nbsp;·&nbsp; Q/E strafe &nbsp;·&nbsp; SHIFT run &nbsp;·&nbsp; " +
                  "SPACE interact &nbsp;·&nbsp; T wireframe/solid &nbsp;·&nbsp; M minimap" : "");
}
setHelp();
let last = performance.now(), fps = 60, statTimer = 0;

function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0.0001;
  if (dt > 0.05) dt = 0.05;                 // clamp after tab switches
  fps += (1 / dt - fps) * 0.1;

  update(dt);

  const dirX = Math.cos(player.a), dirY = Math.sin(player.a);
  const planeX = -dirY * TAN_HALF, planeY = dirX * TAN_HALF;  // camera plane

  fbChar.fill(" ");
  fbShade.fill(0);

  nowMs = now;
  castColumns(dirX, dirY, planeX, planeY);
  updateFocus();
  if (msgUntil && now > msgUntil) { msgEl.style.opacity = "0"; msgUntil = 0; }
  drawWalls();
  drawGrid(dirX, dirY, planeX, planeY);
  blit();
  drawJoystick();
  if (showMap) drawMinimap();

  statTimer += dt;
  if (statTimer > 0.15) {
    statTimer = 0;
    statsEl.textContent = W < 560
      ? "x " + player.x.toFixed(1) + " y " + player.y.toFixed(1) + "  " + fps.toFixed(0) + "fps"
      : "x " + player.x.toFixed(2) + "  y " + player.y.toFixed(2) +
        "  a " + (player.a * 180 / Math.PI).toFixed(0).padStart(4) + "°" +
        "   grid " + COLS + "×" + ROWS +
        "   " + fps.toFixed(0) + " fps";
  }

  requestAnimationFrame(frame);
}

layout();
requestAnimationFrame(frame);
</script>
