[package]
name = "game"
description = "Arena prototype: macroquad front-end plus headless/screenshot hooks."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "arena"
path = "src/main.rs"

[dependencies]
combat = { path = "../combat" }
macroquad.workspace = true
serde.workspace = true
ron.workspace = true

[features]
# Sound playback (needs ALSA dev libs on Linux: libasound2-dev).
audio = ["macroquad/audio"]
