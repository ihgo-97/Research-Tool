[workspace]
resolver = "2"
members = ["crates/combat", "crates/game"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
hecs = "0.11"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
macroquad = { version = "0.4", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
